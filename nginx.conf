user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    ##
    # Basic Settings
    ##

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    # server_tokens off;

    # server_names_hash_bucket_size 64;
    # server_name_in_redirect off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
    ssl_prefer_server_ciphers on;

    ##
    # Logging Settings
    ##

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##

    gzip on;

    upstream ai_frontend_backend {
        server 47.110.80.173:80;
        keepalive 16;
    }

    upstream tutor_platform_backend {
        server 106.15.75.94:80;
        keepalive 16;
    }

    # 合并 HTTP 重定向和 HTTPS 配置
    server {
        listen 80;
        server_name applet.zhiyouyue.top internal.zhiyouyue.top www.zhiyouyue.top;
        return 301 https://$host$request_uri;
    }

    # www.ai.zhiyouyue.top
    server {
        listen 80;
        server_name www.ai.zhiyouyue.top;
        return 301 https://$host$request_uri;
    }

    # www.ai.zhiyouyue.top — 面试助手前端 + /api 反代
    server {
        listen 443 ssl;
        server_name www.ai.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/www.ai.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/www.ai.zhiyouyue.top/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        # 安全增强（SAMEORIGIN：允许本站 iframe 嵌套隐私协议页，仍禁止外站嵌套整站）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        client_max_body_size 100m;

        root /home/work/ai-frontend/;
        index index.html index.htm;

        # 静态法律文档：禁止回退到 SPA index，避免 iframe 加载到首页
        location /legal/ {
            try_files $uri =404;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 面试模拟作答 multipart（录音+视频）须放宽上传体积
        location /api/ {
            client_max_body_size 100m;
            proxy_pass http://ai_frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host 47.110.80.173;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1500s;
            proxy_read_timeout 1500s;
        }

        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires max;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # www.tutor-platform.zhiyouyue.top
    server {
        listen 80;
        server_name www.tutor-platform.zhiyouyue.top;
        return 301 https://$host$request_uri;
    }

    # www.tutor-platform.zhiyouyue.top — 导师平台前端 + /api 反代
    server {
        listen 443 ssl;
        server_name www.tutor-platform.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/www.tutor-platform.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/www.tutor-platform.zhiyouyue.top/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        client_max_body_size 100m;

        root /home/work/tutor-frontend/;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            client_max_body_size 100m;
            proxy_pass http://tutor_platform_backend;
            proxy_http_version 1.1;
            proxy_set_header Host 106.15.75.94;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1500s;
            proxy_read_timeout 1500s;
        }

        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires max;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # www.zhiyouyue.top
    server {
        listen 443 ssl;
        server_name www.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/www.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/www.zhiyouyue.top/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        root /home/work/website/;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_param PHP_ADMIN_VALUE "open_basedir=/home/work/website/:/tmp/:/proc/:/var/lib/php/sessions/";
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~ /\.ht {
            deny all;
        }

        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires max;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # applet.zhiyouyue.top
    server {
        listen 443 ssl;
        server_name applet.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/applet.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/applet.zhiyouyue.top/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        location / {
            proxy_pass http://127.0.0.1:7001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # internal.zhiyouyue.top
    server {
        listen 443 ssl;
        server_name internal.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/internal.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/internal.zhiyouyue.top/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:40011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    # admin.zhiyouyue.top
    server {
        listen 443 ssl;
        server_name admin.zhiyouyue.top;

        ssl_certificate /etc/letsencrypt/live/admin.zhiyouyue.top/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/admin.zhiyouyue.top/privkey.pem; # managed by Certbot

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        root /home/work/admin-frontend/;
        index index.html index.htm;

        location /api/v1/ {
            proxy_pass http://127.0.0.1:8050;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires max;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    server {
        if ($host = www.zhiyouyue.top) {
            return 301 https://$host$request_uri;
        } # managed by Certbot

        return 404; # managed by Certbot
    }
}

